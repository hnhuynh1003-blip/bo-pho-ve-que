name: UI WebKit pour comparison
on:
  push:
    branches: [work/v88-17-1-10-ui]
    paths:
      - tests/test_boba_pour_input_v881710.mjs
      - .github/workflows/ui-webkit-pour-compare.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 793704021bc4be7827390656a0c3d0f9eae25d0f
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Compare trusted input on both revisions
        shell: bash
        env:
          BPVQ_QA_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          mkdir -p evidence/baseline evidence/candidate
          failed=0
          for variant in baseline candidate; do
            python3 -m http.server 8765 --bind 127.0.0.1 --directory "$variant" > "evidence/$variant/server.log" 2>&1 &
            server=$!
            trap 'kill "$server" 2>/dev/null || true' EXIT
            for attempt in {1..20}; do
              if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
              sleep 1
            done
            set +e
            BPVQ_QA_OUTPUT="$PWD/evidence/$variant" node candidate/tests/test_boba_pour_input_v881710.mjs > "evidence/$variant/input.log" 2>&1
            status=$?
            set -e
            echo "$status" | tee "evidence/$variant/status.txt"
            tail -n 20 "evidence/$variant/input.log"
            if [ "$status" -ne 0 ]; then failed=1; fi
            kill "$server"
            trap - EXIT
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boba-pour-${{ matrix.engine }}-baseline-candidate
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
