name: Visual QA boba counter
on:
  push:
    branches:
      - feat/v88-17-1-9-cup-handoff
      - work/v88-17-1-10-ui
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static premium counter regression
        run: |
          node --check js/v88-17-1-9-premium-counter.js
          node --check js/v88-17-1-7-counter-remake.js
          node tests/test_premium_counter_v881719.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 beautifulsoup4==4.14.2
          python -m playwright install --with-deps chromium
      - name: Capture baseline fixture
        if: github.ref == 'refs/heads/work/v88-17-1-10-ui'
        run: |
          mkdir -p artifacts/boba-before
          cp css/v88-17-1-9-premium-counter.css /tmp/boba-after.css
          git fetch --depth=1 origin 793704021bc4be7827390656a0c3d0f9eae25d0f
          git show FETCH_HEAD:css/v88-17-1-9-premium-counter.css > css/v88-17-1-9-premium-counter.css
          trap 'cp /tmp/boba-after.css css/v88-17-1-9-premium-counter.css' EXIT
          BPVQ_QA_CAPTURE_ONLY=1 BPVQ_QA_OUTPUT=artifacts/boba-before python tests/_visual_premium179.py | tee artifacts/boba-before/geometry.log
        shell: bash
      - name: Capture and validate candidate fixture
        run: |
          set -o pipefail
          mkdir -p artifacts/boba-after
          BPVQ_QA_OUTPUT=artifacts/boba-after python tests/_visual_premium179.py | tee artifacts/boba-after/geometry.log
        shell: bash
      - name: Keep QA screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boba-counter-visual-qa
          path: artifacts/boba-*/
          if-no-files-found: warn
          retention-days: 14
